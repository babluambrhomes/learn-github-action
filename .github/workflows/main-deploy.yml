name: Main - Check Build and Deploy to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build-check:
    name: TypeScript, Lint and Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Lint check
        run: npm run lint

      - name: Build
        run: npm run build


  # ==========================================
  # JOB 2: DEPLOY TO VPS
  # ==========================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs: build-check

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/learn-git/learn-github-action

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building production..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart ambr-homes

            echo "Deployment completed successfully!"