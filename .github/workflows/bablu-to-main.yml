name: Bablu Branch - Check Build and Merge to Main

on:
  push:
    branches:
      - bablu

permissions:
  contents: write

jobs:

  build-check:
    name: Check and Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout bablu branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Lint check
        run: npm run lint

      - name: Build
        run: npm run build

  merge-to-main:
    name: Merge Bablu to Main
    runs-on: ubuntu-latest

    needs: build-check

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch branches
        run: |
          git fetch origin main
          git fetch origin bablu

      - name: Merge bablu into main
        run: |
          git checkout main

          git merge origin/bablu --no-edit

          git push origin main