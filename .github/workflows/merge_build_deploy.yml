name: Check, Merge, Build and Deploy

on:
  push:
    branches:
      - bablu

permissions:
  contents: write

jobs:

  # ==========================================
  # JOB 1: CHECK BABLU
  # ==========================================
  check-bablu:
    name: Check bablu
    runs-on: ubuntu-latest

    steps:

      - name: Checkout bablu
        uses: actions/checkout@v4
        with:
          ref: bablu

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Lint check
        run: npm run lint

      - name: Build
        run: npm run build


  # ==========================================
  # JOB 2: MERGE BABLU INTO MAIN
  # ==========================================
  merge:
    name: Merge bablu into main
    runs-on: ubuntu-latest

    needs: check-bablu

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge bablu into main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin main
          git fetch origin bablu

          git checkout main
          git merge origin/bablu --no-edit
          git push origin main


  # ==========================================
  # JOB 3: CHECK MAIN
  # ==========================================
  check-main:
    name: Check main
    runs-on: ubuntu-latest

    needs: merge

    steps:

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

      - name: Lint check
        run: npm run lint

      - name: Build
        run: npm run build


  # ==========================================
  # JOB 4: DEPLOY TO VPS
  # ==========================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    needs: check-main

    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            cd /var/www/learn-git/learn-github-action

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building production..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart learn-github-action

            echo "Deployment completed successfully!"