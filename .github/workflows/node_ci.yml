name: CI

on:
    push: 
        branches:
            - main

    pull_request:
        branches:
            - main

    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            
            - name: setup node.js
              uses: actions/setup-node@v4

              with:
                node-version: 22
                cache: npm

            - name: install dependencies
              run: npm ci

            - name: run lint
              run: npm run lint

            - name: build appliction
              run: npm run build